name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test root module
        run: |
          go vet ./...
          go test -race -v ./...

      - name: Test middleware/gin submodule
        working-directory: middleware/gin
        run: |
          go vet ./...
          go test -race -v ./...
      
      - name: Test middleware/echo submodule
        working-directory: middleware/echo
        run: |
          go vet ./...
          go test -race -v ./...

      - name: Test middleware/chi submodule
        working-directory: middleware/chi
        run: |
          go vet ./...
          go test -race -v ./...

      - name: Test eventbus/redis submodule
        working-directory: eventbus/redis
        run: |
          go vet ./...
          go test -race -v ./...

      - name: Test metrics/prometheus submodule
        working-directory: metrics/prometheus
        run: |
          go vet ./...
          go test -race -v ./...

      - name: Test ratelimit/redis submodule
        working-directory: ratelimit/redis
        run: |
          go vet ./...
          go test -race -v ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # Installed once; govulncheck is a plain binary usable from any
      # working-directory below, one install covers every module.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: go mod verify (root)
        run: go mod verify

      - name: govulncheck (root)
        run: govulncheck ./...

      - name: golangci-lint (root)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: go mod verify (middleware/gin)
        working-directory: middleware/gin
        run: go mod verify

      - name: govulncheck (middleware/gin)
        working-directory: middleware/gin
        run: govulncheck ./...

      - name: golangci-lint (middleware/gin)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: middleware/gin

      - name: go mod verify (middleware/echo)
        working-directory: middleware/echo
        run: go mod verify

      - name: govulncheck (middleware/echo)
        working-directory: middleware/echo
        run: govulncheck ./...

      - name: golangci-lint (middleware/echo)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: middleware/echo

      - name: go mod verify (middleware/chi)
        working-directory: middleware/chi
        run: go mod verify

      - name: govulncheck (middleware/chi)
        working-directory: middleware/chi
        run: govulncheck ./...

      - name: golangci-lint (middleware/chi)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: middleware/chi

      - name: go mod verify (eventbus/redis)
        working-directory: eventbus/redis
        run: go mod verify

      - name: govulncheck (eventbus/redis)
        working-directory: eventbus/redis
        run: govulncheck ./...

      - name: golangci-lint (eventbus/redis)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: eventbus/redis

      - name: go mod verify (metrics/prometheus)
        working-directory: metrics/prometheus
        run: go mod verify

      - name: govulncheck (metrics/prometheus)
        working-directory: metrics/prometheus
        run: govulncheck ./...

      - name: golangci-lint (metrics/prometheus)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: metrics/prometheus

      - name: go mod verify (ratelimit/redis)
        working-directory: ratelimit/redis
        run: go mod verify

      - name: govulncheck (ratelimit/redis)
        working-directory: ratelimit/redis
        run: govulncheck ./...

      - name: golangci-lint (ratelimit/redis)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ratelimit/redis

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans git history, not just the working tree — it
          # needs the full history to do that, not the default shallow
          # clone.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}