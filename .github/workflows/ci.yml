name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test root module
        run: |
          go vet ./...
          go test -race -v ./...

      - name: Test middleware/gin submodule
        working-directory: middleware/gin
        run: |
          go vet ./...
          go test -race -v ./...
      
      - name: Test middleware/echo submodule
        working-directory: middleware/echo
        run: |
          go vet ./...
          go test -race -v ./...